<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block titulo %}Tienda{% endblock %} | TechStore</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="{% url 'catalogo:home' %}">TechStore</a>
        <div class="navbar-nav">
          <a class="nav-link" href="{% url 'catalogo:home' %}">Inicio</a>
          <a class="nav-link" href="{% url 'catalogo:lista' %}">Catálogo</a>
        </div>
      </div>
    </nav>

    <main class="container my-4 flex-grow-1">
      {% block contenido %}{% endblock %}
    </main>

    <footer class="bg-dark text-white text-center py-3">
      Jackeline Vivanco Solano · Desarrollo de Aplicaciones Web · UNCP {% now
      "Y" %}
    </footer>
  </body>
</html>
